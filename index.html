<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Projeto4-Animação barra de navegação</title>
</head>
<body>
    
    <div class="container">
        <input type="radio" name="desliza" id="home" checked>
        <input type="radio" name="desliza" id="blog">
        <input type="radio" name="desliza" id="codigo">
        <input type="radio" name="desliza" id="ajuda">
        <input type="radio" name="desliza" id="sobre">
        <nav>
            <div class="desliza">

            </div>
            <label for="home" class="home">
                <i class="fas fa-home"></i>Home
            </label>
            <label for="blog" class="blog">
                <i class="fas fa-blog"></i>Blog
            </label>
            <label for="codigo" class="codigo">
                <i class="fas fa-code"></i>Código
            </label>
            <label for="ajuda" class="ajuda">
                <i class="fas fa-envelope"></i>Ajuda
            </label>
            <label for="sobre" class="sobre">
                <i class="fas fa-user"></i>Sobre
            </label>
        </nav>
    </div>
</body>
</html>
